<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pasito</title>
<meta name="description" content="Listas de tareas, recordatorios y ánimo para cerebros con TDAH.">
<meta name="theme-color" content="#2847D1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand"><span class="hl on">Pasito</span></span>
    <button class="profile-btn" id="profileBtn" data-action="open-profiles">
      <span class="avatar" id="profileAvatar" aria-hidden="true"></span>
      <span class="profile-name" id="profileName"></span>
    </button>
    <button class="icon-btn" id="settingsBtn" data-action="open-settings" aria-label="Ajustes">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
    </button>
  </header>

  <form class="capture" id="captureForm" autocomplete="off">
    <label for="captureInput" class="sr-only">Anotar una tarea nueva</label>
    <input id="captureInput" maxlength="200" placeholder="Saca una idea de tu cabeza…" enterkeyhint="done">
    <button type="submit" class="btn primary">Anotar</button>
  </form>

  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="tabs-inner">
    <button class="tab" data-tab="hoy">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      <span>Hoy</span>
    </button>
    <button class="tab" data-tab="tareas">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/><path d="m3.8 6.4 1.2 1.2 2.2-2.4M3.8 11.9 5 13.1l2.2-2.4"/><circle cx="5.3" cy="17.5" r="1.3"/></svg>
      <span>Tareas</span>
    </button>
    <button class="tab" data-tab="enfoque">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 1.8M9.5 2.8h5M18.5 6.2l1.3-1.3"/></svg>
      <span>Enfoque</span>
    </button>
    <button class="tab" data-tab="logros">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.6l2.55 5.2 5.75.83-4.16 4.05.98 5.72L12 16.7l-5.12 2.7.98-5.72L3.7 9.63l5.75-.83z"/></svg>
      <span>Logros</span>
    </button>
  </div>
</nav>

<section class="reminder" id="reminder" role="alertdialog" aria-labelledby="remTitle" hidden></section>

<div class="overlay" id="sheet" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" id="sheetClose" data-action="close-sheet" aria-label="Cerrar">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body"></div>
  </section>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
